<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RelexMovie - Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.8)), url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            backdrop-filter: blur(12px);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 0 1rem rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            margin: 1rem;
        }
        .animate-fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 480px) {
            .card { margin: 0.5rem; padding: 1rem; }
            h1 { font-size: 1.5rem; }
            input, button { font-size: 0.875rem; padding: 0.5rem; }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center">
    <div class="card animate-fade-in">
        <div class="flex justify-center mb-6">
            <img src="https://via.placeholder.com/150x50?text=RelexMovie" alt="RelexMovie Logo" class="h-12 filter drop-shadow-lg">
        </div>
        <h1 class="text-2xl font-bold text-center text-white mb-4">Admin Login</h1>
        <form method="POST" action="admin.php" class="mb-4">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-200 mb-1">Username</label>
                <input type="text" name="username" class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg text-white focus:outline-none" required>
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-200 mb-1">Password</label>
                <input type="password" name="password" class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg text-white focus:outline-none" required>
            </div>
            <button type="submit" name="login" class="w-full bg-blue-600 text-white p-3 rounded-lg hover:bg-blue-700 transition duration-300">Login</button>
        </form>
        <p class="text-center text-xs text-gray-400">Secured by RelexMovie © 2025</p>
    </div>
</body>
</html>
